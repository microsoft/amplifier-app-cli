name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Typical runtime is ~20-30s. A hang must fail LOUDLY and fast, not sit
    # burning runner time until the 6h default limit -- macOS minutes bill at
    # 10x, and a job stuck at "in_progress" reads as "not done yet" rather
    # than "broken", which is how a false green gets merged.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # requires-python = ">=3.11" in pyproject.toml -- cover the floor
        # and the latest supported minor.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Verify image routing dependency
        run: uv run --no-sync python -c "from amplifier_foundation.operation_routing import prepare_operation"

      - name: Run test suite
        # No exclusions: Mac/Windows keep their full canonical suite. Linux
        # below proves exhaustive, disjoint execution across bounded jobs.
        run: uv run pytest -q

  linux-plan:
    name: Collect Linux coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - name: Collect the full canonical suite and prove exact partitions
        run: uv run --no-sync python scripts/ci_pytest_shards.py plan --output ci-evidence/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-plan-${{ matrix.python-version }}
          path: ci-evidence/plan.json
          if-no-files-found: error

  linux-shard:
    name: pytest Linux ${{ matrix.shard }} (py${{ matrix.python-version }})
    needs: linux-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [general, policy-transfer, memory-0, memory-2, memory-8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - name: Verify image routing dependency
        run: uv run --no-sync python -c "from amplifier_foundation.operation_routing import prepare_operation"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-plan-${{ matrix.python-version }}
          path: ci-evidence
      - name: Recollect full suite, verify plan, then execute this partition
        # Each memory parameter runs in its own fresh job/Python process.
        # No warm-up, xdist dependency, timeout increase or hidden exclusion.
        run: uv run --no-sync python scripts/ci_pytest_shards.py run --plan ci-evidence/plan.json --shard "${{ matrix.shard }}" --output "ci-evidence/result-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-result-${{ matrix.python-version }}-${{ matrix.shard }}
          path: ci-evidence/result-${{ matrix.shard }}.json
          if-no-files-found: error

  linux-coverage:
    # Preserve the two existing Ubuntu required-check identities. A subset's
    # green result is insufficient: missing/cancelled/failed shards fail join.
    name: pytest (ubuntu-latest, py${{ matrix.python-version }})
    if: always()
    needs: [linux-plan, linux-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-plan-${{ matrix.python-version }}
          path: ci-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-result-${{ matrix.python-version }}-*
          path: ci-results
      - name: Require successful planner and shard job lifecycles
        # Even a valid uploaded result cannot waive a later job cancellation
        # or failed upload. Matrix aggregate failure conservatively fails both
        # joins; neither required check can report a subset's success.
        env:
          PLAN_RESULT: ${{ needs.linux-plan.result }}
          SHARD_RESULT: ${{ needs.linux-shard.result }}
        run: python -c "import os, sys; sys.exit(0 if os.environ['PLAN_RESULT'] == os.environ['SHARD_RESULT'] == 'success' else 'Planner or shard job did not succeed')"
      - name: Require exact full-suite terminal coverage
        run: uv run --no-sync python scripts/ci_pytest_shards.py join --plan ci-evidence/plan.json --results ci-results --output ci-evidence/join.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-coverage-${{ matrix.python-version }}
          path: ci-evidence/join.json
          if-no-files-found: error
      - name: Verify installed doctor wheel and generated legacy launcher outside checkout
        if: matrix.python-version == '3.11' && success()
        shell: bash
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/doctor-wheels"
          uv venv "$RUNNER_TEMP/doctor-runtime"
          uv pip install --python "$RUNNER_TEMP/doctor-runtime/bin/python" "$RUNNER_TEMP"/doctor-wheels/*.whl
          cp tests/check_doctor_wheel.py tests/doctor_safety_probe.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u PYTHONDONTWRITEBYTECODE "$RUNNER_TEMP/doctor-runtime/bin/python" check_doctor_wheel.py

  integration:
    name: pytest -m integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # These fork real pty children. A pty child whose output is never drained
    # can wedge unreapably on macOS (state ``?Es``), so this job is the most
    # likely place in the repo for a hang to appear. Bound it.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # No windows-latest here, deliberately. Every test this job selects
        # (`-m integration`) forks a real child process and, in most of the
        # files, allocates a real pty pair via the POSIX-only `pty`/`termios`
        # stdlib modules -- there is no Windows equivalent of either
        # mechanism. `test_ctrlc_functional_integration.py` and
        # `test_terminal_echo_integration.py` already `pytest.skip(...,
        # allow_module_level=True)` on win32 (they import `pty`/`termios` at
        # module scope, so skipping is the only way to avoid a collection
        # error). `test_stdout_offload_freeze_integration.py` calls
        # `os.fork()` directly with no platform guard at all, and `os.fork`
        # simply does not exist on Windows -- it fails with
        # `AttributeError: module 'os' has no attribute 'fork'`
        # (confirmed on a real windows-latest run, job id 94301234220).
        # A Windows leg of this job would therefore either run zero tests
        # (all skipped) or hard-fail on the one file missing a guard -- pure
        # CI theatre, burning runner minutes to report a "green" (or "red")
        # that says nothing about Windows support. If a genuinely
        # cross-platform integration test is ever added to this job, add
        # windows-latest back for it specifically.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run integration tests
        # pyproject.toml sets `addopts = -m "not integration"`, so these tests
        # -- the ones that fork a real pty child and probe real termios state
        # -- are skipped by default and, before this job existed, ran nowhere.
        # They are exactly the tests that guard the dedicated-tty-input
        # mechanism, so they get their own job (POSIX only -- see the
        # `matrix.os` comment above for why Windows is excluded).
        run: uv run pytest -m integration -q
